<style>

    min-width: 280px;

  .modal {

  /* AI 讲卦风格切换 */

<script>
  const baguaDiv = document.getElementById('bagua');
  const hexagram = ['━━━&nbsp;&nbsp;&nbsp;&nbsp;━━━','━━━━━━━']; 
  const hexagramyao = ['六','九']; //阴爻和阳爻
  let count = 0; // 计数器
  var interval;
  let changingYaoPosition = -1; // 新增：记录变爻位置
  let changingYaoName = ''; // 变爻名称
  var yaoArr = [];

  var ques = "";//用户想探讨的问题

  // 起卦方式：已去掉选择按钮，固定使用八卦盘
  function getSelectedDivinationMethod() {
    return 'roulette';
  }

  // 语音输入：在问题输入框右下角注入麦克风图标，点击开始/停止语音识别，识别结果实时写入输入框
  function setupVoiceInput(popup) {
    const textarea = popup.querySelector('.swal2-textarea');
    if (!textarea) return;
    const Recognizer = window.SpeechRecognition || window.webkitSpeechRecognition;

    // 用相对定位容器包住 textarea，方便把麦克风图标绝对定位在框内
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;';
    textarea.parentNode.insertBefore(wrap, textarea);
    wrap.appendChild(textarea);
    textarea.style.width = '100%';
    textarea.style.margin = '0';
    textarea.style.resize = 'none';

    const mic = document.createElement('button');
    mic.type = 'button';
    mic.title = '语音输入';
    mic.style.cssText = 'position:absolute;right:10px;bottom:10px;width:34px;height:34px;border:none;border-radius:50%;background:#f3f4f6;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .2s;';
    mic.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>';
    wrap.appendChild(mic);

    let recog = null;
    let listening = false;
    let baseText = '';    // 开始录音时输入框已有内容
    let finalText = '';   // 本次录音已确定的识别结果

    function stopListening() {
      try { recog && recog.stop(); } catch (e) { /* 忽略 */ }
    }
    // 弹窗关闭时释放麦克风
    window._stopVoiceInput = stopListening;

    function setMicIdle() {
      listening = false;
      mic.style.background = '#f3f4f6';
      mic.style.boxShadow = 'none';
      mic.title = '语音输入';
    }
    function setMicListening() {
      listening = true;
      mic.style.background = '#fee2e2';
      mic.style.boxShadow = '0 0 0 4px rgba(239,68,68,.15)';
      mic.title = '正在聆听，点击结束';
    }
    function showTip(text) {
      Swal.showValidationMessage(text);
      setTimeout(() => Swal.resetValidationMessage(), 2600);
    }

    if (!Recognizer) {
      mic.style.opacity = '0.35';
      mic.title = '当前浏览器不支持语音输入';
      mic.addEventListener('click', () => showTip('当前浏览器不支持语音输入，请使用最新版 Chrome 或 Edge。'));
      return;
    }

    mic.addEventListener('click', () => {
      if (listening) { stopListening(); return; }
      recog = new Recognizer();
      recog.lang = 'zh-CN';
      recog.continuous = true;
      recog.interimResults = true;
      baseText = textarea.value ? textarea.value.replace(/\n+$/, '') + '\n' : '';
      finalText = '';
      recog.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) { finalText += t; } else { interim += t; }
        }
        textarea.value = baseText + finalText + interim;
      };
      recog.onend = setMicIdle;
      recog.onerror = (e) => {
        setMicIdle();
        const tips = {
          'not-allowed': '麦克风权限被拒绝，请在浏览器地址栏允许使用麦克风。',
          'no-speech': '没有听到声音，请靠近一点再试。',
          'network': '语音服务网络异常，请稍后再试。'
        };
        showTip(tips[e.error] || '语音识别出错，请再试一次。');
      };
      try { recog.start(); setMicListening(); } catch (err) { /* start 冲突时静默 */ }
    });
  }

  document.getElementById('startButton').addEventListener('click', function() {
    var msg = "请输入您本次想探讨的问题";
    var btnName1 = "想好了，开始";
    var btnName2 = "先看看";

    if(buguanum > 2){
      msg = "《易经》重在反复体会卦理。同一个问题建议不必反复起卦，可先把上次的解读记下来，过些时日再回看，往往更有收获。"
      btnName1 = "我再起一卦";
      btnName2 = "好的，先回看";
    }
    // 使用其他提示插件替换confirm
    Swal.fire({
        // title: '请输入您本次想探讨的问题',
        text: msg,
        // icon: 'info',
        showCancelButton: true,
        confirmButtonText: btnName1,
        cancelButtonText: btnName2,
        input: 'textarea',  // 新增：添加文本框
        inputPlaceholder: '友情提示：同一问题不必反复起卦，重在体会卦理。\r\r\n建议围绕「可不可行、合不合适、好不好、要不要」这类问题来提问，例如「现在换行做茶饮生意可不可行？」，这样解读会更明确。',  // 新增：文本框提示
        didOpen: (popup) => { setupVoiceInput(popup); },   // 注入语音输入麦克风图标
        willClose: () => { if (window._stopVoiceInput) window._stopVoiceInput(); }  // 关闭弹窗释放麦克风
    }).then((result) => {
        if (result.isConfirmed) {
            // 检查用户输入是否为空
            if (!result.value) {
                Swal.fire({
                    icon: 'warning',
                    text: '请先写下您想探讨的问题，否则无法为您起卦。'
                });
                return; // 结束函数，等待用户输入
            }

            ques = result.value;
           doBugua();
        }else{
          // ques = "今天买电脑吗？";
          // doBugua();
        }
    });
  });

  // 起卦函数
  function doBugua(){
     // 用户点击了确定
      count = 0;
      changingYaoPosition = -1;
      changingYaoName = '';
      yaoArr = [];

      // 根据选择的起卦方式执行不同的函数
      const method = getSelectedDivinationMethod();

      // 八卦盘复用页面上的盘面（首页常驻），其他方式清空重画
      if (method !== 'roulette') {
        baguaDiv.innerHTML = '';
      }
      document.getElementById('guaName').textContent = '';
      document.getElementById('changingYaoName').textContent = '';

      // 隐藏起卦按钮
      document.getElementById('startButton').style.display = 'none';

      changingYaoPosition = Math.floor(Math.random() * 6);

      switch(method) {
        case 'single':
          // 原有的单爻随机方式
          getRandomHexagram();
          interval = setInterval(function() {
              getRandomHexagram()
          }, 1000);
          break;
        case 'slotMachine':
          // 走马灯方式
          doSlotMachineDivination();
          break;
        case 'roulette':
          // 八卦盘方式
          doRouletteDivination();
          break;
      }
      
      document.getElementById('explainButton').style.display = 'none';
  }

  function getRandomHexagram() {
    if (count < 6) {
        const randomIndex = Math.floor(Math.random() * hexagram.length);
        yaoArr[count] = randomIndex;
        // 先不添加 changing-yao class
        baguaDiv.innerHTML = `<span data-yao="${count}">${hexagram[randomIndex]}</span><br>` + baguaDiv.innerHTML;
        count++;
        
        // 当所有爻都显示完成后
        if (count === 6) {
            const guaName = getGuaName();
            clearInterval(interval);
            
            // 为变爻添加红色样式
            setTimeout(() => {
                const changingYaoElement = document.querySelector(`[data-yao="${changingYaoPosition}"]`);
                if (changingYaoElement) {
                    changingYaoElement.classList.add('changing-yao');
                }
            }, 100);
        }
    }
  }
  
  // 走马灯方式起卦
    function doSlotMachineDivination() {
    // 创建双轮盘容器
    baguaDiv.innerHTML = `
      <div style="position: relative; width: 300px; height: 300px; margin: 0 auto;">
        <!-- 外圈（上三爻） -->
        <div id="outerRing" style="
          position: absolute;
          width: 100%;
          height: 100%;
          border: 2px solid #333;
          border-radius: 50%;
          animation: rotateOuter 4s linear infinite;
        ">
          <!-- 外圈卦象 -->
          <div style="position: absolute; top: 0; left: 50%; transform: translateX(-50%);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; top: 10%; right: 10%; transform: rotate(30deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; top: 30%; right: 3%; transform: rotate(60deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; bottom: 30%; right: 3%; transform: rotate(120deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; bottom: 10%; right: 10%; transform: rotate(150deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; bottom: 0; left: 50%; transform: translateX(-50%) rotate(180deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; bottom: 10%; left: 10%; transform: rotate(210deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; bottom: 30%; left: 3%; transform: rotate(240deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; top: 30%; left: 3%; transform: rotate(300deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; top: 10%; left: 10%; transform: rotate(330deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
        </div>
        
        <!-- 内圈（下三爻） -->
        <div id="innerRing" style="
          position: absolute;
          width: 70%;
          height: 70%;
          top: 15%;
          left: 15%;
          border: 2px solid #333;
          border-radius: 50%;
          animation: rotateInner 4s linear infinite;
        ">
          <!-- 内圈卦象 -->
          <div style="position: absolute; top: 0; left: 50%; transform: translateX(-50%);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; top: 15%; right: 15%; transform: rotate(45deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; bottom: 15%; right: 15%; transform: rotate(135deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; bottom: 0; left: 50%; transform: translateX(-50%) rotate(180deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; bottom: 15%; left: 15%; transform: rotate(225deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
          <div style="position: absolute; top: 15%; left: 15%; transform: rotate(315deg);">${hexagram[Math.floor(Math.random() * hexagram.length)]}</div>
        </div>
        
        <!-- 指针 -->
        <div style="
          position: absolute;
          top: -10px;
          left: 50%;
          transform: translateX(-50%);
          width: 4px;
          height: 20px;
          background-color: red;
          z-index: 10;
        "></div>
      </div>
    `;
    
    // 添加旋转动画样式
    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes rotateOuter {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes rotateInner {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
    `;
    document.head.appendChild(style);
    
    // 开始旋转并逐渐停止
    setTimeout(() => {
      const outerRing = document.getElementById('outerRing');
      const innerRing = document.getElementById('innerRing');
      
      // 停止外圈旋转
      setTimeout(() => {
        outerRing.style.animation = 'none';
        
        // 保存外圈结果（上三爻）
        yaoArr[3] = Math.floor(Math.random() * hexagram.length); // 四爻
        yaoArr[4] = Math.floor(Math.random() * hexagram.length); // 五爻
        yaoArr[5] = Math.floor(Math.random() * hexagram.length); // 上爻
      }, 4000);
      
      // 停止内圈旋转
      setTimeout(() => {
        innerRing.style.animation = 'none';
        
        // 保存内圈结果（下三爻）
        yaoArr[0] = Math.floor(Math.random() * hexagram.length); // 初爻
        yaoArr[1] = Math.floor(Math.random() * hexagram.length); // 二爻
        yaoArr[2] = Math.floor(Math.random() * hexagram.length); // 三爻
        
        // 显示最终卦象
        setTimeout(() => {
          displayFinalHexagram();
        }, 500);
      }, 6000);
    }, 1000);
  }
  
  // 八卦盘方式起卦（双环转盘：内环下卦顺时针，外环上卦逆时针，合成64卦）
  const trigramList = [
    { name: '乾', nature: '天', code: '111' },
    { name: '兑', nature: '泽', code: '110' },
    { name: '离', nature: '火', code: '101' },
    { name: '震', nature: '雷', code: '100' },
    { name: '巽', nature: '风', code: '011' },
    { name: '坎', nature: '水', code: '010' },
    { name: '艮', nature: '山', code: '001' },
    { name: '坤', nature: '地', code: '000' },
  ];

  // ===== 八卦盘几何参数（viewBox 400×400，圆心 200,200）=====
  const RC = 200;            // 圆心坐标
  const R_DISC = 194;        // 外盘半径
  const R_INNER_DISC = 120;  // 内盘半径
  const R_CENTER = 46;       // 盘心白圈半径
  // 外环（上卦）：加厚，卦符与卦名都完整落在扇区内
  const OUTER = { band: [120, 192], glyphR: 165, nameR: 127, bw: 40, bh: 6.5, gap: 5, font: 16 };
  // 内环（下卦）
  const INNER = { band: [52, 118], glyphR: 90, nameR: 60, bw: 34, bh: 5.5, gap: 4.5, font: 14 };

  // 绘制三爻卦符（三横），中心在 (cx, cy)。code[0] 为该卦初爻（最下面一横）
  function trigramGlyphSVG(code, cx, cy, color, bw, bh, gap) {
    let s = '';
    for (let row = 0; row < 3; row++) {
      const bit = code[2 - row]; // 从上往下画：先画上爻
      const y = cy - (3 * bh + 2 * gap) / 2 + row * (bh + gap);
      if (bit === '1') {
        s += `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="${color}"/>`;
      } else {
        const half = (bw - gap) / 2;
        s += `<rect x="${cx - bw / 2}" y="${y}" width="${half}" height="${bh}" rx="2" fill="${color}"/>`;
        s += `<rect x="${cx + bw / 2 - half}" y="${y}" width="${half}" height="${bh}" rx="2" fill="${color}"/>`;
      }
    }
    return s;
  }

  // 构建一个可旋转的圆环转子（8 个卦象扇区）
  function buildRotorSVG(id, ring, color) {
    let sectors = '';
    for (let i = 0; i < 8; i++) {
      const t = trigramList[i];
      sectors += `
        <g transform="rotate(${i * 45} ${RC} ${RC})">
          ${trigramGlyphSVG(t.code, RC, RC - ring.glyphR, color, ring.bw, ring.bh, ring.gap)}
          <text x="${RC}" y="${RC - ring.nameR}" text-anchor="middle" font-size="${ring.font}" font-weight="bold" fill="#8a6d3b">${t.nature}</text>
        </g>`;
    }
    return `<g id="${id}">${sectors}</g>`;
  }

  // 顶部高亮框：标出最上方这对上下卦（它们组成了最终卦）
  // 框是静止的（不随环旋转），始终罩住 12 点方向的扇区
  function topHighlightSVG() {
    const a1 = -112.5, a2 = -67.5; // 顶部扇区左右边界（与分隔线对齐）
    const col = '#c0392b';
    const pt = (r, a) => `${(RC + r * Math.cos(a * Math.PI / 180)).toFixed(2)},${(RC + r * Math.sin(a * Math.PI / 180)).toFixed(2)}`;
    // 环形扇区路径（内半径 rIn 到外半径 rOut）
    const band = (rIn, rOut) =>
      `M${pt(rOut, a1)} A${rOut},${rOut} 0 0 1 ${pt(rOut, a2)}` +
      ` L${pt(rIn, a2)} A${rIn},${rIn} 0 0 0 ${pt(rIn, a1)} Z`;

    let s = `<g id="topHighlight" pointer-events="none">`;
    s += `<defs><filter id="hlGlow" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="${col}" flood-opacity="0.4"/>
      </filter></defs>`;
    // 外环（上卦）
    s += `<path d="${band(OUTER.band[0] + 2, OUTER.band[1] - 2)}" fill="rgba(192,57,43,0.06)" stroke="${col}" stroke-width="2" stroke-linejoin="round" filter="url(#hlGlow)"/>`;
    // 内环（下卦）
    s += `<path d="${band(INNER.band[0] + 2, INNER.band[1] - 2)}" fill="rgba(192,57,43,0.06)" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    s += `</g>`;
    return s;
  }

  // 构建八卦盘整体 SVG
  function buildRouletteSVG() {
    const stroke = '#5a4632';
    let svg = `<svg id="rouletteSvg" width="400" height="400" viewBox="0 0 400 400" style="width:min(400px,88vw,58vh);height:auto;display:block;">`;
    // 外盘底
    svg += `<circle cx="${RC}" cy="${RC}" r="${R_DISC}" fill="rgba(255,252,242,0.92)" stroke="${stroke}" stroke-width="3"/>`;
    // 外环分隔线
    for (let i = 0; i < 8; i++) {
      const a = (i * 45 + 22.5 - 90) * Math.PI / 180;
      const x1 = RC + R_INNER_DISC * Math.cos(a), y1 = RC + R_INNER_DISC * Math.sin(a);
      const x2 = RC + (R_DISC - 2) * Math.cos(a), y2 = RC + (R_DISC - 2) * Math.sin(a);
      svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#c9b98f" stroke-width="1"/>`;
    }
    // 内盘底（盖住外盘中部）
    svg += `<circle cx="${RC}" cy="${RC}" r="${R_INNER_DISC}" fill="rgba(255,252,242,0.95)" stroke="${stroke}" stroke-width="2"/>`;
    // 内环分隔线
    for (let i = 0; i < 8; i++) {
      const a = (i * 45 + 22.5 - 90) * Math.PI / 180;
      const x1 = RC + INNER.band[0] * Math.cos(a), y1 = RC + INNER.band[0] * Math.sin(a);
      const x2 = RC + (R_INNER_DISC - 2) * Math.cos(a), y2 = RC + (R_INNER_DISC - 2) * Math.sin(a);
      svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#c9b98f" stroke-width="1"/>`;
    }
    // 转子（外环=上卦，内环=下卦）
    svg += buildRotorSVG('outerRotor', OUTER, '#333');
    svg += buildRotorSVG('innerRotor', INNER, '#333');
    // 顶部高亮框：罩住最上方这对上下卦（组成最终卦）
    svg += topHighlightSVG();
    // 中央：实时卦象（随双环转动实时拼合更新）
    svg += `<circle cx="${RC}" cy="${RC}" r="${R_CENTER}" fill="#fff8e7" stroke="${stroke}" stroke-width="2"/>`;
    svg += `<g id="centerHex"></g>`;
    svg += `</svg>`;
    return svg;
  }

  // 用 requestAnimationFrame 驱动转子旋转（缓动减速，可精确停在指定角度）
  function animateRotor(el, from, target, duration, onUpdate, onDone) {
    const start = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - start) / duration);
      const ease = 1 - Math.pow(1 - t, 4); // 四次方缓出，先快后慢
      const ang = from + (target - from) * ease;
      el.setAttribute('transform', `rotate(${ang} ${RC} ${RC})`);
      if (onUpdate) onUpdate(ang);
      if (t < 1) {
        requestAnimationFrame(frame);
      } else if (onDone) {
        onDone();
      }
    }
    requestAnimationFrame(frame);
  }

  // 双环当前角度（首页空转与正式旋转之间无缝衔接）
  let rouletteToken = 0;
  const rouletteState = { inner: 0, outer: 0 };

  // 首页常驻八卦盘：缓慢空转，盘心实时卦象随之变化
  function startRouletteIdle() {
    const token = ++rouletteToken;
    baguaDiv.innerHTML = buildRouletteSVG() +
      `<div id="rouletteReadout" style="font-size:14px;color:#5a4632;margin-top:6px;text-shadow:1px 1px 2px rgba(255,255,255,0.8);">静心凝神，点击「起一卦」开始</div>`;

    const innerRotor = document.getElementById('innerRotor');
    const outerRotor = document.getElementById('outerRotor');
    let lastKey = -1;
    let last = performance.now();

    function tick(now) {
      if (token !== rouletteToken || !innerRotor || !innerRotor.isConnected) return; // 正式起卦接管或盘面被移除
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      rouletteState.inner = (rouletteState.inner + 10 * dt) % 360;  // 缓慢顺时针
      rouletteState.outer = (rouletteState.outer - 7 * dt) % 360;   // 缓慢逆时针
      innerRotor.setAttribute('transform', `rotate(${rouletteState.inner} ${RC} ${RC})`);
      outerRotor.setAttribute('transform', `rotate(${rouletteState.outer} ${RC} ${RC})`);

      const kL = ((Math.round(-rouletteState.inner / 45) % 8) + 8) % 8;
      const kU = ((Math.round(-rouletteState.outer / 45) % 8) + 8) % 8;
      const key = kL * 8 + kU;
      if (key !== lastKey) {
        lastKey = key;
        updateCenterHex(kL, kU, -1);
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function doRouletteDivination() {
    rouletteToken++; // 停掉首页空转

    // 复用页面上已有的盘面（首页空转或上一卦结果），没有则新建
    let innerRotor = document.getElementById('innerRotor');
    let outerRotor = document.getElementById('outerRotor');
    if (!innerRotor || !outerRotor) {
      baguaDiv.innerHTML = buildRouletteSVG();
      rouletteState.inner = 0;
      rouletteState.outer = 0;
      innerRotor = document.getElementById('innerRotor');
      outerRotor = document.getElementById('outerRotor');
    }

    // 读数区（首页空转时已存在，直接复用）
    let readout = document.getElementById('rouletteReadout');
    if (!readout) {
      readout = document.createElement('div');
      readout.id = 'rouletteReadout';
      readout.style.cssText = 'font-size:14px;color:#5a4632;margin-top:6px;text-shadow:1px 1px 2px rgba(255,255,255,0.8);';
      baguaDiv.appendChild(readout);
    }
    readout.textContent = '卦象推演中...';

    // 预先随机决定内卦（下）与外卦（上），旋转结束后精确停在该卦位
    const lowerIdx = Math.floor(Math.random() * 8);
    const upperIdx = Math.floor(Math.random() * 8);

    const startInner = rouletteState.inner;
    const startOuter = rouletteState.outer;
    let innerAng = startInner, outerAng = startOuter;
    let innerDone = false, outerDone = false;

    function updateReadout() {
      if (!readout) return;
      if (innerDone && outerDone) {
        readout.textContent = `得卦：上${trigramList[upperIdx].nature}下${trigramList[lowerIdx].nature}`;
      } else {
        const kL = ((Math.round(-innerAng / 45) % 8) + 8) % 8;
        const kU = ((Math.round(-outerAng / 45) % 8) + 8) % 8;
        readout.textContent = `上${trigramList[kU].nature} · 下${trigramList[kL].nature}`;
        // 盘心实时卦象：内环顶部=下卦，外环顶部=上卦
        updateCenterHex(kL, kU, -1);
      }
    }

    // 从当前角度出发：内环顺时针至少3圈，外环逆时针至少4圈，精确落在指定卦位
    const startModI = ((startInner % 360) + 360) % 360;
    const endModI = ((360 - (lowerIdx * 45) % 360) % 360 + 360) % 360;
    const innerTarget = startInner + (((endModI - startModI + 360) % 360) + 360 * 3);

    const startModO = ((startOuter % 360) + 360) % 360;
    const endModO = ((360 - (upperIdx * 45) % 360) % 360 + 360) % 360;
    const outerTarget = startOuter - (((startModO - endModO + 360) % 360) + 360 * 4);

    animateRotor(innerRotor, startInner, innerTarget, 4200, ang => { innerAng = ang; rouletteState.inner = ang; updateReadout(); }, () => {
      innerDone = true;
      updateReadout();
    });
    animateRotor(outerRotor, startOuter, outerTarget, 5600, ang => { outerAng = ang; rouletteState.outer = ang; updateReadout(); }, () => {
      outerDone = true;
      updateReadout();
      // 双环都停稳后，展示完整卦象
      setTimeout(() => showRouletteResult(lowerIdx, upperIdx), 600);
    });
  }

  // 八卦盘结果：内外卦合并为六爻，盘心卦象定格并标出变爻
  function showRouletteResult(lowerIdx, upperIdx) {
    const bits = (trigramList[lowerIdx].code + trigramList[upperIdx].code).split('');
    for (let i = 0; i < 6; i++) {
      yaoArr[i] = Number(bits[i]);
    }

    // 走原有流程：出卦名、变爻名、记录储卦、放出按钮
    getGuaName();

    // 盘心卦象定格为最终结果，变爻标红

    const readout = document.getElementById('rouletteReadout');
    if (readout) {
      const yaoText = document.getElementById('changingYaoName').textContent;
      readout.textContent = `上${trigramList[upperIdx].nature}下${trigramList[lowerIdx].nature} · 变爻：${yaoText}`;
    }
  }

  // 盘心实时卦象：六爻由下卦（内环顶部）与上卦（外环顶部）实时拼合
  // changingPos < 0 时不标红（旋转过程中）
  function updateCenterHex(lowerIdx, upperIdx, changingPos) {
    const g = document.getElementById('centerHex');
    if (!g) return;

    const cx = RC, cy = RC;
    const bw = 54, bh = 6, gap = 5;
    const totalH = 6 * bh + 5 * gap;
    const bits = (trigramList[lowerIdx].code + trigramList[upperIdx].code).split('');

    let s = '';
    for (let row = 0; row < 6; row++) {
      const yaoIdx = 5 - row; // 第一行画上爻
      const y = cy - totalH / 2 + row * (bh + gap);
      const isChanging = (changingPos >= 0 && yaoIdx === changingPos);
      const color = isChanging ? '#d33' : '#333';

      if (bits[yaoIdx] === '1') {
        s += `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${bh}" rx="1.5" fill="${color}"/>`;
      } else {
        const part = (bw - 5) / 2;
        s += `<rect x="${cx - bw / 2}" y="${y}" width="${part}" height="${bh}" rx="1.5" fill="${color}"/>`;
        s += `<rect x="${cx + bw / 2 - part}" y="${y}" width="${part}" height="${bh}" rx="1.5" fill="${color}"/>`;
      }
    }
    g.innerHTML = s;
  }

  // 走马灯方式的结果展示（纯爻线，不带八卦盘的表针）
  function displayFinalHexagram() {
    let finalHexagram = '';
    for (let i = 5; i >= 0; i--) {
      finalHexagram += `<span data-yao="${i}">${hexagram[yaoArr[i]]}</span><br>`;

    setTimeout(() => {

      if (changingYaoElement) {

      }
    }, 100);

    return getGuaName();
  }

  try {
    await getOpenAIStream(explainAbort.signal);
  } catch (error) {
    if (error && error.name === 'AbortError') return; // 切换风格/关闭弹窗导致的中止，无需提示
    console.error('获取解释失败：', error);

    // 组装具体报错原因
    let reason;
    if (error instanceof TypeError) {
      // fetch 抛 TypeError：浏览器拦截（跨域预检失败）或网络不通
      reason = '请求未能发出：通常是浏览器跨域(CORS)限制或网络不通，需通过后端代理调用 AI 接口';
    } else if (error && error.message) {
      reason = error.message;
    } else {
      reason = '未知错误';
    }
    const parts = [];
    if (error && error.status) parts.push(`HTTP ${error.status}`);
    if (error && error.code) parts.push(`错误码 ${error.code}`);
    const detail = parts.length ? `${reason}（${parts.join('，')}）` : reason;

    const out = document.getElementById('output');
    if (out) {
      out.innerHTML = `
        <p>抱歉，AI 解读服务暂时不可用，请稍后再试。</p>
        <p style="font-size:13px;color:#999;margin-top:4px;">原因：${detail}</p>
      `;
    } else {
      modalContent.innerHTML = `
        <p>此卦为：${guaName}</p>
        <p>变爻：${changingYaoText}</p>
        <p>卦象解释：抱歉，获取解释失败。</p>
        <p style="font-size:13px;color:#999;">原因：${detail}</p>
      `;
    }
  }

// 风格切换：点击头像卡片切换，弹窗打开时自动重新解读
document.querySelectorAll('.style-opt').forEach(el => {

var reload = true;
// 关闭按钮功能
document.querySelector('.close').addEventListener('click', function() {
  document.getElementById('explainModal').style.display = "none";
  if (explainAbort) { try { explainAbort.abort(); } catch (_) {} } // 停止流式请求
  stopReadAloud(); // 停止语音朗读
  reload = false;
});

// 流式获取 AI 返回结果（走自建后端代理，AI Key 保存在服务端）
// 页面部署在服务器 nginx 上时走同源相对路径（无跨域/混合内容问题）；
// 本地 file:// 直接打开时回退到服务器 IP 直连
const AI_API_BASE = (location.protocol === 'file:') ? 'http://82.156.210.116/8gua-api' : '/8gua-api';
async function getOpenAIStream(signal) {
    const guaName = document.getElementById('guaName').textContent;
    const changingYaoText = document.getElementById('changingYaoName').textContent;
    let city = '未知城市';
    try { city = await getUserCity(); } catch (e) { /* 获取失败不影响解读 */ }

    const response = await fetch(AI_API_BASE + '/api/gua/explain', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: signal,
        // 后端会记录：用户信息(IP/UA/城市)、问题、卦象、风格，并代理调用 AI 大模型
        body: JSON.stringify({
            question: ques,
            guaName: guaName,
            changingYao: changingYaoText,
            city: city,
            style: explainStyle
        })
    });

    // 接口报错（服务不可用等）时把真实原因抛给调用方
    if (!response.ok) {
      let msg = `HTTP ${response.status}`;
      let code = '';
      try {
        const errText = await response.text();
        const errJson = JSON.parse(errText);
        if (errJson && errJson.error) {
          code = errJson.error.code || '';
          msg = errJson.error.message || msg;
        } else if (errText) {
          msg = errText.slice(0, 200);
        }
      } catch (e) { /* 解析失败就用默认信息 */ }
      const err = new Error(msg);
      err.code = code;
      err.status = response.status;
      throw err;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let done = false;
    let textBuffer = '';

    while (!done && reload) {
      const { value, done: readerDone } = await reader.read();
      if (value) {
          const chunkValue = decoder.decode(value);
          //console.info(chunkValue);
          const lines = chunkValue.split('\n').filter(line => line.trim() !== '');
          lines.forEach(line => {
              if (line.startsWith('data: ')) {
                  const jsonLine = line.replace('data: ', '');
                  if (jsonLine === '[DONE]') { done = true; return; }
                  const jsonData = JSON.parse(jsonLine);
                  if (jsonData.error) {
                      // 后端透传的接口错误（余额不足、鉴权失败等）
                      const err = new Error(jsonData.error.message || 'AI 接口出错');
                      err.code = jsonData.error.code || '';
                      throw err;
                  }
                  if (jsonData.choices && jsonData.choices[0].delta.content) {
                      textBuffer += jsonData.choices[0].delta.content;
                      document.getElementById('output').innerHTML = marked(textBuffer); // 逐步更新页面内容
                      var div1 = document.getElementById('modal-content');
                      div1.scrollTop = div1.scrollHeight;//滚动条始终在底部
                  }
              }
          });
      } else {
          done = readerDone; // 流结束

          // 保存到相册
          
      }
    }
  }

  // ---- 语音朗读（Web Speech API，默认关闭，点击开始/停止） ----
  function setReadAloudUI(on) {
    const t = document.getElementById('readAloudText');
    const btn = document.getElementById('readAloudBtn');
    if (t) t.textContent = on ? '停止朗读' : '语音朗读';
    if (btn) btn.style.background = on
      ? 'linear-gradient(135deg, #f14668, #e03c5f)'
      : 'linear-gradient(135deg, #48c774, #3db869)';
  }

  function stopReadAloud() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    setReadAloudUI(false);
  }

  function toggleReadAloud() {
    if (!('speechSynthesis' in window)) {
      showToast('当前浏览器不支持语音朗读，请使用 Chrome / Edge');
      return;
    }
    // 正在朗读 → 停止
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
      stopReadAloud();
      return;
    }
    // 组装朗读文本：卦名标题 + 解读正文
    const title = (document.getElementById('modalTitle').textContent || '').trim();
    const body = document.getElementById('output');
    const text = (title ? title + '。' : '') + (body ? body.innerText : '');
    if (!text.trim()) {
      showToast('暂无可朗读的内容');
      return;
    }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.95;
    u.pitch = 1;
    u.onend = () => setReadAloudUI(false);
    u.onerror = () => setReadAloudUI(false);
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    setReadAloudUI(true);
  }

  // ---- 分享（保存图片 / 发送给朋友 / 分享到朋友圈） ----
  function showToast(title) {
    if (window.Swal) {
      Swal.fire({ toast: true, position: 'center', showConfirmButton: false, timer: 2000, title: title });
    } else {
      alert(title);
    }
  }

  // http 环境下 navigator.clipboard 不可用，降级 execCommand
  function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
        return true;
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:-999px;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  function getShareUrl() {
    return location.protocol.startsWith('http')
      ? location.origin + location.pathname.replace(/[^/]*$/, '')
      : 'http://82.156.210.116/8gua/';
  }

  function openShareSheet() {
    const title = (document.getElementById('modalTitle').textContent || '易经卦象解读').trim();
    const shareUrl = getShareUrl();
    const btnCss = 'width:100%;padding:14px 0;font-size:16px;font-weight:500;border:none;border-radius:10px;cursor:pointer;color:#fff;';
    Swal.fire({
      title: '分享这份解读',
      html: `
        <div style="display:flex;flex-direction:column;gap:12px;margin-top:6px;">
          <button id="share-save" style="${btnCss}background:linear-gradient(135deg,#3298dc,#2793da);">🖼️ 保存图片</button>
          <button id="share-friend" style="${btnCss}background:linear-gradient(135deg,#48c774,#3db869);">💬 发送给朋友</button>
          <button id="share-moments" style="${btnCss}background:linear-gradient(135deg,#ff9f43,#ff8a2a);">🌐 分享到朋友圈</button>
        </div>`,
      showConfirmButton: false,
      showCloseButton: true,
      didOpen: (popup) => {
        popup.querySelector('#share-save').addEventListener('click', () => {
          Swal.close();
          downloadPic();
        });
        popup.querySelector('#share-friend').addEventListener('click', async () => {
          Swal.close();
          if (navigator.share) {
            try { await navigator.share({ title: title, text: '我在春风易学起了一卦：' + title, url: shareUrl }); } catch (e) { /* 用户取消忽略 */ }
          } else if (copyText(shareUrl)) {
            showToast('链接已复制，去粘贴发给朋友吧');
          } else {
            showToast('复制失败，请手动复制地址栏链接');
          }
        });
        popup.querySelector('#share-moments').addEventListener('click', async () => {
          Swal.close();
          if (copyText(shareUrl)) {
            showToast('链接已复制，发朋友圈时粘贴即可；也可先保存图片配文发送');
          } else {
            showToast('复制失败，请手动复制地址栏链接');
          }
        });
      }
    });
  }

  // 保存到相册：将解卦结果卡片截图并下载为 PNG
  async function downloadPic() {
    const target = document.getElementById('modal-content');
    if (!target) return;
    const btn = target.querySelector('button.button.is-info');
    const closeIcon = target.querySelector('.close');

    // 临时展开完整高度，避免长图被 max-height/overflow 裁剪
    const oldMaxHeight = target.style.maxHeight;
    const oldOverflow = target.style.overflowY;
    target.style.maxHeight = 'none';
    target.style.overflowY = 'visible';
    // 截图时隐藏按钮和关闭图标（visibility 保持占位，布局不跳动）
    if (btn) btn.style.visibility = 'hidden';
    if (closeIcon) closeIcon.style.visibility = 'hidden';

    // 截图前在卡片底部追加「系统地址二维码 + 扫码起卦」区块，截图后移除
    let qrBlock = null;
    try {
      if (typeof QRCode !== 'undefined') {
        const siteUrl = location.protocol.startsWith('http')
          ? location.origin + location.pathname.replace(/[^/]*$/, '')
          : 'http://82.156.210.116/8gua/';
        qrBlock = document.createElement('div');
        qrBlock.style.cssText = 'padding:20px 0 28px;text-align:center;background:#ffffff;border-top:1px solid #f0f0f0;';
        const qrHolder = document.createElement('div');
        qrHolder.style.cssText = 'display:inline-block;padding:10px;border:1px solid #ececec;border-radius:10px;';
        new QRCode(qrHolder, { text: siteUrl, width: 140, height: 140, correctLevel: QRCode.CorrectLevel.M });
        qrBlock.appendChild(qrHolder);
        const tip = document.createElement('div');
        tip.textContent = '扫码起卦';
        tip.style.cssText = 'margin-top:10px;font-size:17px;font-weight:600;color:#333;letter-spacing:3px;';
        qrBlock.appendChild(tip);
        target.appendChild(qrBlock);
      }
    } catch (e) {
      console.error('生成二维码失败：', e);
    }

    try {
      const canvas = await html2canvas(target, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
      });
      const link = document.createElement('a');
      const title = (document.getElementById('modalTitle').textContent || '解卦结果').trim();
      link.download = title + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (e) {
      console.error('生成图片失败：', e);
      if (window.Swal) {
        Swal.fire({ icon: 'error', title: '生成图片失败', text: '请稍后再试' });
      }
    } finally {
      if (qrBlock) qrBlock.remove();
      target.style.maxHeight = oldMaxHeight;
      target.style.overflowY = oldOverflow;
      if (btn) btn.style.visibility = '';
      if (closeIcon) closeIcon.style.visibility = '';
    }
  }

  // 使用免费的 IP 地理位置 API
  async function getUserCity() {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      // 定义回调函数
      window.IPCallBack = function(data) {
        if (data.pro && data.city) {
          resolve(data.pro + '-' + data.city);
        } else {
          resolve("未知城市");
        }
        // 清理：删除script标签和全局回调
        document.body.removeChild(script);
        delete window.IPCallBack;
      };
      
      // 使用JSONP方式请求
      script.src = 'https://whois.pconline.com.cn/ipJson.jsp?callback=IPCallBack';
      script.onerror = () => {
        reject(new Error('获取城市失败'));
        document.body.removeChild(script);
        delete window.IPCallBack;
      };
      document.body.appendChild(script);
    });
  }
  
  // 页面加载后：首页常驻八卦盘，缓慢空转待卦
  startRouletteIdle();
